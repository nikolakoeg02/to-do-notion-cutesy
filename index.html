<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=790, initial-scale=1.0">

<title>To-Do List</title>

<style>

/* =========================================
   GENERAL SETTINGS
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 790px;
    height: 670px;

    overflow: hidden;
}

body {
    background: transparent;

    font-family:
        "Bodoni 72",
        "Bodoni MT",
        Didot,
        "Times New Roman",
        serif;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.todo-container {

    width: 790px;
    height: 670px;

    background: #F9F5F0;

    border-radius: 25px;

    overflow: hidden;

    border: 1px solid #F5C0B9;
}


/* =========================================
   HEADER
========================================= */

.header {

    width: 100%;
    height: 105px;

    background: #F5C0B9;

    display: flex;

    align-items: center;

    justify-content: center;
}

.header h1 {

    margin: 0;

    color: #F9DDD6;

    font-size: 48px;

    font-weight: 500;

    letter-spacing: 1px;

    line-height: 1;
}


/* =========================================
   TASK AREA
========================================= */

.tasks {

    width: 100%;

    height: 565px;

    padding:
        20px 35px;

    background: #F9F5F0;

    overflow: hidden;
}


/* =========================================
   INDIVIDUAL TASK
========================================= */

.task {

    width: 100%;

    height: 105px;

    display: flex;

    align-items: center;

    border-bottom:
        1px solid #E5D5D0;
}


/* =========================================
   CHECK CIRCLE
========================================= */

.check {

    width: 25px;
    height: 25px;

    min-width: 25px;

    border:
        2px solid #C99B94;

    border-radius: 50%;

    margin-right: 20px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #F9DDD6;

    font-family: Arial, sans-serif;

    font-size: 15px;

    transition:
        background 0.2s ease,
        border 0.2s ease,
        transform 0.2s ease;
}


/* Circle hover */

.check:hover {

    transform: scale(1.08);

    border-color: #F5C0B9;
}


/* Completed circle */

.check.completed {

    background: #F5C0B9;

    border-color: #F5C0B9;
}


/* =========================================
   EDITABLE TEXT
========================================= */

.task-input {

    flex: 1;

    width: 100%;

    border: none;

    outline: none;

    background: transparent;

    font-family:
        "Bodoni 72",
        "Bodoni MT",
        Didot,
        "Times New Roman",
        serif;

    font-size: 22px;

    color: #765C58;

    padding: 5px 0;
}


/* Placeholder */

.task-input::placeholder {

    color: #BDA39D;

    opacity: 1;
}


/* =========================================
   COMPLETED TASK
========================================= */

.task.completed-task .task-input {

    text-decoration:
        line-through;

    opacity: 0.5;
}


/* =========================================
   MOBILE SAFETY
========================================= */

@media (max-width: 790px) {

    html,
    body {

        width: 100%;

        height: auto;

        overflow: hidden;
    }

    .todo-container {

        width: 100%;

        height: 670px;
    }

    .tasks {

        padding-left: 25px;

        padding-right: 25px;
    }
}

</style>
</head>


<body>


<!-- =========================================
     TO-DO WIDGET
========================================= -->

<div class="todo-container">


    <!-- HEADER -->

    <div class="header">

        <h1>To-Do</h1>

    </div>


    <!-- TASK AREA -->

    <div class="tasks" id="tasks">


        <!-- TASK 1 -->

        <div class="task">

            <div class="check"></div>

            <input
                class="task-input"
                type="text"
                placeholder="Write a task..."
            >

        </div>


        <!-- TASK 2 -->

        <div class="task">

            <div class="check"></div>

            <input
                class="task-input"
                type="text"
                placeholder="Write a task..."
            >

        </div>


        <!-- TASK 3 -->

        <div class="task">

            <div class="check"></div>

            <input
                class="task-input"
                type="text"
                placeholder="Write a task..."
            >

        </div>


        <!-- TASK 4 -->

        <div class="task">

            <div class="check"></div>

            <input
                class="task-input"
                type="text"
                placeholder="Write a task..."
            >

        </div>


        <!-- TASK 5 -->

        <div class="task">

            <div class="check"></div>

            <input
                class="task-input"
                type="text"
                placeholder="Write a task..."
            >

        </div>


    </div>

</div>


<script>

/* =========================================
   CHECKBOX FUNCTION
========================================= */

const checks =
    document.querySelectorAll(".check");


checks.forEach(function(check, index) {

    check.addEventListener(
        "click",
        function() {

            const task =
                this.parentElement;


            /* Toggle completed */

            this.classList.toggle(
                "completed"
            );


            /* COMPLETED */

            if (
                this.classList.contains(
                    "completed"
                )
            ) {

                this.innerHTML = "✓";

                task.classList.add(
                    "completed-task"
                );

                localStorage.setItem(
                    "todo-completed-" + index,
                    "true"
                );

            }


            /* NOT COMPLETED */

            else {

                this.innerHTML = "";

                task.classList.remove(
                    "completed-task"
                );

                localStorage.setItem(
                    "todo-completed-" + index,
                    "false"
                );

            }

        }
    );

});


/* =========================================
   SAVE TASK TEXT
========================================= */

const inputs =
    document.querySelectorAll(
        ".task-input"
    );


inputs.forEach(function(input, index) {


    /* Load saved text */

    const savedText =
        localStorage.getItem(
            "todo-text-" + index
        );


    if (savedText !== null) {

        input.value =
            savedText;

    }


    /* Save text while typing */

    input.addEventListener(
        "input",
        function() {

            localStorage.setItem(
                "todo-text-" + index,
                input.value
            );

        }
    );

});


/* =========================================
   LOAD COMPLETED TASKS
========================================= */

checks.forEach(function(check, index) {

    const completed =
        localStorage.getItem(
            "todo-completed-" + index
        );


    if (completed === "true") {

        check.classList.add(
            "completed"
        );

        check.innerHTML = "✓";

        check.parentElement.classList.add(
            "completed-task"
        );

    }

});

</script>

</body>
</html>
